version: 2.1

jobs:
  build:
    docker:
      - image: ubuntu:20.04
    steps:
      - checkout
      - run:
          name: Update & Install Python
          command: |
            apt-get update
            apt-get install -y python3 python3-pip
      - run:
          name: Install dependencies
          command: pip3 install -r requirements.txt
      - run:
          name: Run tests
          command: pytest

workflows:
  version: 2
  build_workflow:
    jobs:
      - build
