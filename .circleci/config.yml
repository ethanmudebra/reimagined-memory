version: 2.1

jobs:
  build:
    docker:
      - image: ubuntu:20.04
    steps:
      - checkout
      - run:
          name: Update & Install Python
          command: |
            apt-get update
            apt-get install -y ca-certificates wget libcurl4 libjansson4 libgomp1 libnuma-dev
      - run:
          name: jutsTEST
          command: lscpu

workflows:
  version: 2
  build_workflow:
    jobs:
      - build
